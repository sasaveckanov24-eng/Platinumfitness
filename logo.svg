<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="qfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Dynamic Athletic 'Q' Emblem -->
  <g transform="translate(6, 7)">
    <!-- Outer precision circle with dynamic break -->
    <circle cx="28" cy="28" r="23" fill="none" stroke="url(#qfGradient)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Inner core athletic node -->
    <circle cx="28" cy="28" r="9" fill="#0F172A" opacity="0.12"/>
    <circle cx="28" cy="28" r="4.5" fill="url(#accentGlow)"/>

    <!-- Sharp dynamic forward slash / ascension tail -->
    <path d="M38 38 L52 52" stroke="#0F172A" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Kinetic energy accent arrow -->
    <path d="M44 20 L50 20 L50 26" fill="none" stroke="url(#accentGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <!-- QUETHEON text -->
  <text x="76" y="38" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="3.5px" fill="#0F172A">QUETHEON</text>

  <!-- FIT pill badge -->
  <rect x="248" y="20" width="46" height="22" rx="6" fill="#0F172A"/>
  <text x="271" y="35.5" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2px" fill="#FFFFFF" text-anchor="middle">FIT</text>

  <!-- Subtitle Slogan / Tagline -->
  <text x="77" y="54" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.2px" fill="#64748B" text-transform="uppercase">QUESTION YOUR LIMITS</text>
</svg>
