<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <style>
    .brand-text {
      font-family: 'Times New Roman', Times, serif;
      font-weight: bold;
      letter-spacing: 6px;
      fill: #1E293B;
      font-size: 30px;
      text-anchor: middle;
    }
    .sub-text {
      font-family: Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 5px;
      fill: #475569;
      font-size: 12px;
      text-anchor: middle;
    }
    .box {
      fill: none;
      stroke: #1E293B;
      stroke-width: 3;
    }
  </style>
  
  <!-- Знак логотипа -->
  <g transform="translate(210, 10)">
    <!-- Внешняя рамка -->
    <rect x="0" y="0" width="80" height="65" class="box" />
    <!-- Левая стойка буквы П -->
    <rect x="20" y="16" width="12" height="49" fill="#1E293B" />
    <!-- Правая стойка буквы П -->
    <rect x="48" y="16" width="12" height="49" fill="#1E293B" />
    <!-- Звездочка в правом верхнем углу рамки -->
    <path d="M80,3 L81.5,7.5 L86,9 L81.5,10.5 L80,15 L78.5,10.5 L74,9 L78.5,7.5 Z" fill="#1E293B" />
  </g>
  
  <!-- Текст ПЛАТИНУМ -->
  <text x="250" y="112" class="brand-text">ПЛАТИНУМ</text>
  
  <!-- Текст фитнес клуб -->
  <text x="250" y="135" class="sub-text">фитнес клуб</text>
</svg>
